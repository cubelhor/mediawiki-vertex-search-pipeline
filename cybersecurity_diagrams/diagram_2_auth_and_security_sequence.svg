  <text x="405" y="847" text-anchor="middle" font-size="10.8" fill="#047857">Ephemeral tmpfs &amp; secrets wiped from RAM</text>

  <!-- Bottom 4 Defense-in-Depth Cards (y=894..1052) -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="894" width="432" height="158" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.6"/>
    <rect x="24" y="894" width="432" height="7" rx="3.5" fill="#DC2626"/>
  </g>
  <text x="42" y="926" class="card-title">1. Zero Inbound Attack Surface</text>
  <text x="42" y="950" class="card-body">• Runs as a Cloud Run Job (batch execution), NOT a service.</text>
  <text x="42" y="972" class="card-body">• Zero open TCP/HTTP listening ports and no public URL.</text>
  <text x="42" y="994" class="card-body">• Firewall requires only unidirectional outbound TCP 443</text>
  <text x="52" y="1014" class="card-mono">100.90.29.64/26 -> aow.eu.airbus.corp:443</text>
  <text x="42" y="1036" class="card-body">• Non-root minimal image (python:3.12-slim, UID 10001).</text>

  <g filter="url(#cardShadow)">
    <rect x="476" y="894" width="432" height="158" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/>
    <rect x="476" y="894" width="432" height="7" rx="3.5" fill="#059669"/>
  </g>
  <text x="494" y="926" class="card-title">2. Zero Static GCP Keys &amp; EU Secrets</text>
  <text x="494" y="950" class="card-body">• All GCP auth uses short-lived OIDC / Workload Identity ADC.</text>
  <text x="494" y="972" class="card-body">• Airbus CA cert &amp; optional BotPassword stored strictly in</text>
  <text x="504" y="992" class="card-mono">Secret Manager (europe-west4 user-managed)</text>
  <text x="494" y="1014" class="card-body">• Zero secrets in Git (.gitignore) or Docker (.dockerignore).</text>
  <text x="494" y="1036" class="card-body">• Credentials never logged (masked / excluded in logging).</text>

  <g filter="url(#cardShadow)">
    <rect x="928" y="894" width="432" height="158" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <rect x="928" y="894" width="432" height="7" rx="3.5" fill="#1D4ED8"/>
  </g>
  <text x="946" y="926" class="card-title">3. Strict TLS, ACLs &amp; Source Safety</text>
  <text x="946" y="950" class="card-body">• Enforces https:// (validate_https_url rejects plain http://).</text>
  <text x="946" y="972" class="card-body">• TLS 1.2+ verified against Airbus CA (never verify=False).</text>
  <text x="946" y="994" class="card-body">• Respects MediaWiki ACLs (skips 6000:CONTENTCHECK).</text>
  <text x="946" y="1016" class="card-body">• maxlag=5 + backoff protects OpenWiki database availability.</text>
  <text x="946" y="1036" class="card-body">• &gt;=85% Drop-Guard blocks partial crawls from overwriting data.</text>

  <g filter="url(#cardShadow)">
    <rect x="1380" y="894" width="436" height="158" rx="10" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.6"/>
    <rect x="1380" y="894" width="436" height="7" rx="3.5" fill="#7E22CE"/>
  </g>
  <text x="1398" y="926" class="card-title">4. 3-Project Least-Privilege Isolation</text>
  <text x="1398" y="950" class="card-body">• ing-dev SA: storage.objectAdmin, run.invoker, secretAccessor,</text>
  <text x="1408" y="970" class="card-body">data-dom BQ dataOwner+jobUser, everyday-dev editor.</text>
  <text x="1398" y="994" class="card-body">• everyday-dev Discovery SA: dataViewer ONLY on</text>
  <text x="1408" y="1014" class="card-mono">data-dom.wiki_vertex_authorized (not aow_nov_26)</text>
  <text x="1398" y="1036" class="card-body">• Verified inside EU data residency &amp; Airbus VPC-SC.</text>
</svg>
