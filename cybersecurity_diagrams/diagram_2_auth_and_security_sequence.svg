  <!-- Sequence Steps -->
  <line x1="140" y1="222" x2="399" y2="222" stroke="#047857" stroke-width="2.6" marker-end="url(#arrowGreen)"/>  <circle cx="162" cy="222" r="12" fill="#047857"/>  <text x="162" y="226" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">1</text>  <rect x="36.0" y="188" width="648.0" height="26" rx="13" fill="#FFFFFF" stroke="#047857" stroke-width="1.3"/>  <rect x="40.0" y="192" width="86.0" height="18" rx="9" fill="#D1FAE5"/>  <text x="83.0" y="204.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065F46">OIDC TOKEN</text>  <text x="136.0" y="205" font-size="11.2" font-weight="600" fill="#1E293B">POST jobs/mediawiki-vertex-sync:run  (roles/run.invoker • short-lived OIDC)</text>  <line x1="405" y1="296" x2="664" y2="296" stroke="#0F766E" stroke-width="2.6" marker-end="url(#arrowGreen)"/>  <circle cx="427" cy="296" r="12" fill="#0F766E"/>  <text x="427" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">2</text>  <rect x="203.7" y="262" width="666.6" height="26" rx="13" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>  <rect x="207.7" y="266" width="65.6" height="18" rx="9" fill="#CCFBF1"/>  <text x="240.5" y="278.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#115E59">IAM ADC</text>  <text x="283.3" y="279" font-size="11.2" font-weight="600" fill="#1E293B">Fetch Airbus Root CA + optional BotPassword  (roles/secretmanager.secretAccessor)</text>  <line x1="405" y1="370" x2="929" y2="370" stroke="#C2410C" stroke-width="2.6" marker-end="url(#arrowOrange)"/>  <circle cx="427" cy="370" r="12" fill="#C2410C"/>  <text x="427" y="374" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">3</text>  <rect x="315.4" y="336" width="709.2" height="26" rx="13" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.3"/>  <rect x="319.4" y="340" width="86.0" height="18" rx="9" fill="#FFEDD5"/>  <text x="362.4" y="352.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9A3412">DIRECT VPC</text>  <text x="415.4" y="353" font-size="11.2" font-weight="600" fill="#1E293B">Outbound HTTPS egress via 100.90.29.64/26  (--vpc-egress=all-traffic • 0 open ports)</text>  <line x1="935" y1="444" x2="1194" y2="444" stroke="#1D4ED8" stroke-width="2.6" marker-end="url(#arrowBlue)"/>  <circle cx="957" cy="444" r="12" fill="#1D4ED8"/>  <text x="957" y="448" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">4</text>  <rect x="701.9" y="410" width="730.2" height="26" rx="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>  <rect x="705.9" y="414" width="92.8" height="18" rx="9" fill="#DBEAFE"/>  <text x="752.3" y="426.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">TLS 1.2+ CA</text>  <text x="808.7" y="427" font-size="11.2" font-weight="600" fill="#1E293B">HTTPS GET /api.php?list=recentchanges  (Pinned to Airbus Root CA • never verify=False)</text>  <line x1="1200" y1="518" x2="411" y2="518" stroke="#1D4ED8" stroke-width="2.6" marker-end="url(#arrowBlue)"/>  <circle cx="1178" cy="518" r="12" fill="#1D4ED8"/>  <text x="1178" y="522" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">5</text>  <rect x="400.1" y="484" width="803.8" height="26" rx="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.3"/>  <rect x="404.1" y="488" width="79.2" height="18" rx="9" fill="#EFF6FF"/>  <text x="443.7" y="500.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E40AF">READ-ONLY</text>  <text x="493.3" y="501" font-size="11.2" font-weight="600" fill="#1E293B">Return pages + templates if edits detected  (Honors MediaWiki ACLs • maxlag=5 • 2s exit if 0 edits)</text>  <line x1="405" y1="598" x2="1459" y2="598" stroke="#4338CA" stroke-width="2.6" marker-end="url(#arrowIndigo)"/>  <circle cx="427" cy="598" r="12" fill="#4338CA"/>  <text x="427" y="602" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">6</text>  <rect x="417.6" y="564" width="1034.8" height="26" rx="13" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.3"/>  <rect x="421.6" y="568" width="154.0" height="18" rx="9" fill="#E0E7FF"/>  <text x="498.6" y="580.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3730A3">IAM ADC + DROP-GUARD</text>  <text x="585.6" y="581" font-size="11.2" font-weight="600" fill="#1E293B">Verify >=85% Drop-Guard -> Stage gs://mediawiki-data-nov-25 -> Load data-dom.aow_nov_26 -> Refresh wiki_vertex_authorized</text>  <line x1="405" y1="678" x2="1709" y2="678" stroke="#7E22CE" stroke-width="2.6" marker-end="url(#arrowPurple)"/>  <circle cx="427" cy="678" r="12" fill="#7E22CE"/>  <text x="427" y="682" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">7</text>  <rect x="658.4" y="644" width="803.2" height="26" rx="13" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.3"/>  <rect x="662.4" y="648" width="72.4" height="18" rx="9" fill="#F3E8FF"/>  <text x="698.6" y="660.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B21A8">IAM gRPC</text>  <text x="744.8" y="661" font-size="11.2" font-weight="600" fill="#1E293B">Trigger ImportDocumentsRequest (FULL sync)  (project-service-account • roles/discoveryengine.editor)</text>  <line x1="1715" y1="758" x2="1471" y2="758" stroke="#7E22CE" stroke-width="2.6" marker-end="url(#arrowPurple)"/>  <circle cx="1693" cy="758" r="12" fill="#7E22CE"/>  <text x="1693" y="762" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">8</text>  <rect x="878.0" y="724" width="926.0" height="26" rx="13" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.3"/>  <rect x="882.0" y="728" width="154.0" height="18" rx="9" fill="#F3E8FF"/>  <text x="959.0" y="740.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B21A8">AUTHORIZED VIEW ONLY</text>  <text x="1046.0" y="741" font-size="11.2" font-weight="600" fill="#1E293B">Extract ONLY from data-dom.wiki_vertex_authorized  (service-7016082038 • ZERO access to aow_nov_26 / GCS)</text>

